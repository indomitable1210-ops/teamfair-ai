<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>팀플 서약 아이콘 시안</title>
<style>
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:#f6f7f9;color:#111827}
main{max-width:1060px;margin:0 auto;padding:24px 16px 60px}h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.1rem;margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.card p{color:#6b7280;font-size:.88rem;margin:.2em 0 12px}
.sizes{display:flex;align-items:flex-end;gap:14px;padding:14px;border-radius:12px;background:#f3f4f6;margin-bottom:12px}
.sizes img{display:block}.dark{background:#1f2937}
.tab{display:flex;align-items:center;gap:8px;background:#e5e7eb;border-radius:10px 10px 0 0;padding:8px 12px;font-size:.82rem;width:max-content;max-width:100%}
.tab img{width:16px;height:16px}.bar{background:#fff;border:1px solid #e5e7eb;border-top:0;border-radius:0 10px 10px 10px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:800}
.bar img{width:26px;height:26px}
.splash{margin-top:12px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#fff,#eef2ff 60%,#f6f7f9);padding:16px;text-align:center}
.splash .win{background:#fff;border:1px solid #e5e7eb;border-top:4px solid #4f46e5;border-radius:12px;padding:12px;font-weight:900;font-size:.95rem}
.splash img{width:64px;height:64px;margin-bottom:6px}
.rec{display:inline-block;background:#4f46e5;color:#fff;border-radius:999px;font-size:.75rem;padding:2px 9px;margin-left:6px;vertical-align:middle}
</style></head><body><main>
<h1>🤝 팀플 서약 아이콘 시안</h1>
<p style="color:#4b5563">원래 사이트 아이콘(🤝 노란 이모지)과 보내 주신 3D 악수 이미지를 섞은 시안입니다. 각 카드에서 크기별 모습, 브라우저 탭·상단 메뉴·시작화면에 들어갔을 때를 볼 수 있습니다.</p>
<div class="grid" id="grid"></div>
</main>
<script>
const items=[
 ["O_emoji","원래 아이콘 (지금 사이트)",false,"윈도우 이모지 🤝. 노란 손 + 주황 테두리의 납작한 스타일입니다. 비교용으로 함께 보여 드립니다."],
 ["E_yellow3d","E. 노란 3D 손 + 보라 아이콘",true,"새 이미지의 입체감은 살리고 색을 원래 이모지의 노란색으로 바꿨습니다. 보라 배경과 노랑이 보색이라 작은 크기에서도 가장 눈에 띕니다."],
 ["F_flatmix","F. 납작한 이모지 스타일",false,"새 이미지 손 모양을 이모지처럼 3단 노랑 + 주황 테두리로 평평하게 칠했습니다. 흰 카드·보라 테두리 위에 올렸습니다."],
 ["G_emoji3d","G. 원래 이모지를 입체로",false,"원래 🤝 이모지에 광택과 그림자를 더해 3D 느낌을 줬습니다. 지금 사이트와 가장 비슷해서 바꿔도 어색함이 적습니다."],
 ["A_indigo","A. (앞 시안) 피부색 3D",false,"보내 주신 이미지 그대로의 피부색. 비교용입니다."]];
document.getElementById('grid').innerHTML=items.map(([f,t,r,d])=>`<div class="card"><h2>${t}${r?'<span class="rec">추천</span>':''}</h2><p>${d}</p>
<div class="sizes"><img src="${f}_180.png" width="96" height="96"><img src="${f}_180.png" width="48" height="48"><img src="${f}_32.png" width="32" height="32"><img src="${f}_32.png" width="16" height="16"></div>
<div class="sizes dark"><img src="${f}_180.png" width="48" height="48"><img src="${f}_32.png" width="32" height="32"><span style="color:#9ca3af;font-size:.8rem">어두운 배경</span></div>
<div class="tab"><img src="${f}_32.png">팀플 서약</div><div class="bar"><img src="${f}_180.png">팀플 서약</div>
<div class="splash"><img src="${f}_180.png"><div class="win">팀플에 참여하지 않으시겠습니까?</div></div></div>`).join('');
</script></body></html>
